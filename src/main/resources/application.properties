spring.application.name=game-expert

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:game_expert}
spring.datasource.username=${MYSQL_USER:game_expert}
spring.datasource.password=${MYSQL_PASSWORD:game_expert}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

webcraft.chat.pubsub-enabled=true

game.ws.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
